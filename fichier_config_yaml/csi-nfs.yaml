# StorageClass CSI
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi
provisioner: nfs.csi.k8s.io          # <-- Driver CSI
parameters:
  server: loadbalancer-k8s.mon.dom
  share: /srv/nfs/data
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  mountPermissions: "0755"
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
  - hard
  - noatime
---
# PVC (identique, seul storageClassName change)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mon-pvc-csi
spec:
  storageClassName: nfs-csi
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi
